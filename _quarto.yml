project:
  type: default
  output-dir: dist
  render:
    - index.qmd
format:
  html:
    template: template.html
    theme: none
    minimal: true
    html-math-method: plain
    toc: false
    anchor-sections: false
    section-divs: false
    wrap: none
execute:
  enabled: false
html-table-processing: none
html-pre-tag-processing: none
