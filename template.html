<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NIH SRLM S-Curve</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;600;700&family=Architects+Daughter&display=swap" rel="stylesheet">
<style>
/* VOICE: sobrio, de oficina de planificación; el hallazgo como título.
   IDEA: una hoja de papel semilogarítmico de dibujo técnico, como se planificaba a mano.
   PICTURE: la curva S trazada sobre la retícula log: tinta azul U29, lápiz rojo U38, tinta negra real, abanico en grafito.
   COLOUR y TYPE: papel verde pálido con retícula verde de imprenta; Plex Sans Condensed + rotulado a mano Architects Daughter.
   LAYOUT: título y cifras clave, controles, la hoja grande, luego SV(t), tabla por update y método. */
:root{color-scheme:light dark;
--bg:light-dark(#eef2ea,#0f1a15);--paper:light-dark(#f7faf3,#13231c);--ink:light-dark(#18201b,#e4ece6);--mute:light-dark(#56645b,#9fb3a7);
--g1:light-dark(rgba(46,130,84,.95),rgba(96,180,132,.75));--g2:light-dark(rgba(46,130,84,.45),rgba(96,180,132,.35));--g3:light-dark(rgba(46,130,84,.2),rgba(96,180,132,.15));
--b29:light-dark(#1d4fa8,#7fb0ff);--b38:light-dark(#c22f22,#ff8a7a);--b32:light-dark(#7a3fb8,#c9a0ff);--m0:light-dark(#0f766e,#5fd6cf);--m1:light-dark(#b0306a,#ff8fc0);--m2:light-dark(#7a5c00,#e0c25a);--cm:light-dark(#5b6770,#a9b6bf);--ch:light-dark(#d9822b,#ffb35c);--cc:light-dark(#c22f22,#ff8a7a);--act:light-dark(#111,#fff);--fan:light-dark(rgba(80,80,80,.28),rgba(220,220,220,.22));--sel:light-dark(#d9822b,#ffb35c);--line:light-dark(#c9d5c8,#28433a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans Condensed",system-ui,sans-serif;overflow-x:clip}
.band{padding:clamp(24px,3.5vw,52px) max(5vw,16px)}.wrap{max-width:1240px;margin:0 auto}
h1{font-size:clamp(30px,4.2vw,48px);line-height:1.05;margin:0 0 10px;text-wrap:balance;font-weight:700}
h2{font-size:24px;margin:0 0 8px;line-height:1.15}
.tb{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);border:2px solid var(--g1);background:var(--paper);margin-bottom:22px}
.logos{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:20px;background:#fff;padding:14px 22px;border-bottom:2px solid var(--g1)}.logos img{display:block;height:auto;max-height:62px;width:auto;max-width:42%}.logos .hx{max-height:60px}
@media(max-width:600px){.logos{padding:10px 14px}.logos img{max-height:34px}.logos .hx{max-height:30px}}
.tb .main{padding:20px 22px;border-right:1px solid var(--g1)}.tb .kick{font-size:14px;color:var(--mute);margin:0 0 6px}
.tb h1{margin:0}.tb .sub{font-size:19px;margin:8px 0 0;color:var(--ink)}
.tb dl{margin:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.tb dl div{padding:10px 14px;border-bottom:1px solid var(--line);border-left:1px solid var(--line)}
.tb dt{font-size:12px;color:var(--mute)}.tb dd{margin:0;font-weight:600;font-size:15px}
.find{font-size:clamp(20px,2.3vw,26px);line-height:1.25;font-weight:600;margin:0 0 6px;max-width:60ch;text-wrap:balance}
.kf{counter-reset:k;list-style:none;padding:0;margin:18px 0 6px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
@media(max-width:760px){.kf{grid-template-columns:minmax(0,1fr)}}
.kf li{background:var(--paper);padding:14px 16px 14px 52px;position:relative;font-size:15px;line-height:1.5}
.kf li::before{counter-increment:k;content:counter(k);position:absolute;left:14px;top:12px;width:26px;height:26px;border:1.5px solid var(--g1);border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--g1)}
.kf li:last-child:nth-child(odd){grid-column:1/-1}.kf b{display:block;font-size:16px;margin-bottom:2px}
@media(max-width:760px){.tb{grid-template-columns:minmax(0,1fr)}.tb .main{border-right:0;border-bottom:1px solid var(--g1)}}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-top:14px}
.cards div{background:var(--paper);padding:14px 16px}.cards b{display:block;font-size:clamp(26px,3vw,34px);line-height:1.1}.cards span{font-size:14px;color:var(--mute)}
.flag{border-left:4px solid var(--b38);background:var(--paper);padding:14px 18px;margin-top:14px;max-width:90ch}.flag b{color:var(--b38)}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:middle}
.lede{max-width:70ch;color:var(--mute);margin:0}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin:22px 0 18px}
.kpi{background:var(--paper);padding:14px 16px}.kpi b{display:block;font-size:clamp(24px,3vw,34px);line-height:1.1;font-variant-numeric:tabular-nums}.kpi span{font-size:14px;color:var(--mute)}
.ctl{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--g1);border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-size:15px;min-height:40px;padding:0 14px;border:0;background:transparent;color:var(--ink);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--g1);color:var(--paper)}
button:focus-visible,input:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
.ctl label{font-size:14px;color:var(--mute);display:flex;gap:8px;align-items:center}
input[type=range]{width:min(320px,60vw);accent-color:var(--sel);height:40px}
.sheet{background:var(--paper);border:1px solid var(--g2);box-shadow:0 1px 0 var(--line),0 14px 30px -18px rgba(0,0,0,.35);padding:10px 10px 6px}
.fig{position:relative;height:clamp(380px,58vh,620px)}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.fig.sm{height:260px}
.hand{font-family:"Architects Daughter",cursive}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;padding:6px 6px 2px;color:var(--mute)}
.legend i{display:inline-block;width:22px;height:0;border-top:3px solid;vertical-align:middle;margin-right:6px}
.tip{position:absolute;pointer-events:none;background:var(--paper);border:1px solid var(--g1);padding:8px 10px;font-size:13px;line-height:1.4;white-space:nowrap;display:none;box-shadow:0 6px 16px -8px rgba(0,0,0,.4)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums;background:var(--paper)}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-weight:600;color:var(--mute);border-bottom:2px solid var(--g1)}
td:first-child,th:first-child{text-align:left}
tr.on td{background:color-mix(in srgb,var(--sel) 16%,transparent)}
tr.bl td:first-child{font-weight:700}
.neg{color:var(--b38)}
.notes{columns:2 320px;gap:36px;font-size:15px;color:var(--mute)}.notes p{margin:0 0 10px;break-inside:avoid}.notes b{color:var(--ink)}
@media(max-width:800px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.chk{display:inline-flex;gap:6px;flex-wrap:wrap}.chk label{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);font-size:15px;cursor:pointer}.chk input{width:18px;height:18px;margin:0}.chk i{width:18px;border-top:3px dashed;display:inline-block}
.grp{display:flex;flex-direction:column;gap:4px}.grp>span{font-size:13px;color:var(--mute)}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:8px;border-bottom:1px solid var(--line)}.stack td{display:flex;justify-content:space-between;gap:12px;border:0;padding:3px 6px}.stack td::before{content:attr(data-l);color:var(--mute)}}
@media(prefers-reduced-motion:no-preference){.draw{stroke-dasharray:var(--L);stroke-dashoffset:var(--L);animation:d 1.1s ease-out forwards}@keyframes d{to{stroke-dashoffset:0}}}
</style>
</head>
<body>
$body$
</body>
</html>
